<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Status Messages</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f3f5f2;
    --surface: #ffffff;
    --text: #1b2420;
    --muted: #5d6b64;
    --line: #d5dcd7;
    --accent: #1f6f5c;
    --accent-text: #ffffff;
    --done: #0d5c3a;
    --done-bg: #dff3e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17; --surface: #1d2622; --text: #e8efeb; --muted: #9aaba2;
      --line: #2e3b35; --accent: #4fc3a1; --accent-text: #0c1512;
      --done: #8fe3bd; --done-bg: #1e3a2d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17; --surface: #1d2622; --text: #e8efeb; --muted: #9aaba2;
    --line: #2e3b35; --accent: #4fc3a1; --accent-text: #0c1512;
    --done: #8fe3bd; --done-bg: #1e3a2d;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.45;
  }
  main { max-width: 820px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .total { color: var(--muted); font-size: .9rem; }
  .total b { color: var(--text); }
  .reset { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: .85rem; }
  .reset:hover { color: var(--text); border-color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px;
  }
  .counter { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .counter button {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .counter button:hover { border-color: var(--accent); color: var(--accent); }
  .counter input {
    width: 52px; height: 30px; text-align: center; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface); color: var(--text);
    font: inherit; font-weight: 600; -moz-appearance: textfield;
  }
  .counter input::-webkit-outer-spin-button, .counter input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .msg { flex: 1; min-width: 0; font-size: .98rem; overflow-wrap: anywhere; }
  .copy {
    flex-shrink: 0; min-width: 78px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text); font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer;
  }
  .copy.done { background: var(--done-bg); color: var(--done); border-color: var(--done); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 520px) {
    li { flex-wrap: wrap; }
    .msg { flex-basis: 100%; }
    .counter { margin-left: auto; }
  }
</style>
</head>
<body>
<main>
  <h1>CRM status messages</h1>
  <p class="sub">Tap Copy to put a message on your clipboard. Use the counter beside it to tally how often you use it.</p>
  <div class="toolbar">
    <span class="total">Total count: <b id="total">0</b></span>
    <button class="reset" id="reset" type="button">Reset all counters</button>
  </div>
  <ul id="list"></ul>
</main>

<script>
const MESSAGES = [
  "Email Sent.",
  "Email Sent. Call Done.",
  "Email Sent. Call Done. Not Interested.",
  "Email Sent. Call Busy.",
  "Email Sent. Phone Switched off.",
  "Email Sent. Call Not Picked.",
  "Email Sent. No number in crm.",
  "Email Sent. Number temporarily out of service.",
  "Email Sent. Number cannot receive incoming calls.",
  "Email Sent. Invalid Number.",
  "Email Sent. Message sent on WhatsApp.",
  "Email Sent. Call Done. User just exploring. No business usecase.",
  "Email Sent. Call Done. SPAM.",
  "Email Sent. Call Disconnected by User."
];
const KEY = "crm-msg-counters";
let counts = MESSAGES.map(() => 0);
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (Array.isArray(saved) && saved.length === MESSAGES.length) counts = saved.map(n => parseInt(n, 10) || 0);
} catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(counts)); } catch (e) {} }
function updateTotal() { document.getElementById("total").textContent = counts.reduce((a, b) => a + b, 0); }

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

const list = document.getElementById("list");
const inputs = [];

MESSAGES.forEach((text, i) => {
  const li = document.createElement("li");

  const counter = document.createElement("div");
  counter.className = "counter";
  const minus = document.createElement("button");
  minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "Decrease count");
  const input = document.createElement("input");
  input.type = "number"; input.value = counts[i]; input.setAttribute("aria-label", "Count");
  const plus = document.createElement("button");
  plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "Increase count");
  counter.append(minus, input, plus);

  const set = (n) => {
    counts[i] = Number.isFinite(n) ? n : 0;
    input.value = counts[i];
    save(); updateTotal();
  };
  minus.addEventListener("click", () => set(counts[i] - 1));
  plus.addEventListener("click", () => set(counts[i] + 1));
  input.addEventListener("input", () => {
    counts[i] = parseInt(input.value, 10) || 0;
    save(); updateTotal();
  });
  input.addEventListener("blur", () => { input.value = counts[i]; });

  const msg = document.createElement("span");
  msg.className = "msg"; msg.textContent = text;

  const copy = document.createElement("button");
  copy.type = "button"; copy.className = "copy"; copy.textContent = "Copy";
  copy.addEventListener("click", async () => {
    const ok = await copyText(text);
    copy.textContent = ok ? "Copied" : "Failed";
    copy.classList.toggle("done", ok);
    setTimeout(() => { copy.textContent = "Copy"; copy.classList.remove("done"); }, 1400);
  });

  li.append(msg, counter, copy);
  list.appendChild(li);
  inputs.push(input);
});

document.getElementById("reset").addEventListener("click", () => {
  counts = MESSAGES.map(() => 0);
  inputs.forEach(inp => inp.value = 0);
  save(); updateTotal();
});

updateTotal();
</script>
</body>
</html>
